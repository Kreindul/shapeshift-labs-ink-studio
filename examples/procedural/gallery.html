<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ink Studio · Procedural primitives</title>
  <style>
    :root {
      color-scheme: light;
      background: #e9eae3;
      color: #192723;
      font:
        16px system-ui,
        sans-serif;
    }
    body {
      max-width: 1200px;
      margin: auto;
      padding: 24px;
    }
    header {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      align-items: end;
      justify-content: space-between;
      margin-bottom: 22px;
    }
    h1 {
      font:
        clamp(36px, 6vw, 56px) / 1 Georgia,
        serif;
      margin: 4px 0;
    }
    header p {
      color: #515e57;
      margin: 8px 0 0;
    }
    label {
      display: grid;
      gap: 8px;
      font-size: 14px;
    }
    input {
      accent-color: #14665a;
    }
    main {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }
    article {
      border: 1px solid #c9cec0;
      border-radius: 16px;
      background: #faf9f5;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      display: block;
      aspect-ratio: 16/8;
      background: #e3e9df;
    }
    article div {
      padding: 11px 15px 14px;
    }
    h2 {
      font-size: 17px;
      margin: 0 0 4px;
    }
    article p {
      color: #515e57;
      font-size: 13px;
      margin: 0;
      line-height: 1.35;
    }
    @media (max-width: 850px) {
      main {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
    @media (max-width: 540px) {
      body {
        padding: 14px;
      }
      main {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <header>
    <div>
      <h1>Procedural primitives</h1>
      <p>Live geometry from Ink Studio’s core library.</p>
    </div>
    <label for="yaw">View angle <input id="yaw" type="range" min="-100" max="170" value="32" /></label>
  </header>
  <main id="gallery"></main>
  <script>
    /* BUNDLE */
  </script>
</html>
